<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Access Denied</title>
		<style>
			body {
				background-color: #ffffff;
				margin-top: 8%;
				color: #5d5d5d;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
					"Noto Sans", sans-serif;
				text-align: center;
			}

			h1 {
				font-size: 2.45em;
				font-weight: 700;
				color: #2b2b2b;
				letter-spacing: -0.02em;
				margin-bottom: 24px;
				margin-top: 28px;
			}

			.container {
				width: 100%;
				margin-right: auto;
				margin-left: auto;
			}

			.animate__animated {
				animation-duration: 0.8s;
				animation-fill-mode: both;
			}

			.animate__fadeIn {
				animation-name: fadeIn;
			}

			.primary-color {
				color: #ff0055;
				fill: #ff0055;
			}

			.icon-large {
				height: 128px;
				width: 128px;
			}

			.description-text {
				color: #666666;
				letter-spacing: -0.01em;
				font-size: 1.25em;
				line-height: 28px;
			}

			.footer {
				margin-top: 36px;
				font-size: 0.85em;
				color: #888888;
			}

			.footer strong {
				color: #444444;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="row">
				<div class="col">
					<div class="animate__animated animate__fadeIn">
						<svg
							aria-hidden="true"
							focusable="false"
							class="primary-color icon-large"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.75"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path
								d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
								fill="currentColor"
								fill-opacity="0.08"
							></path>
							<rect x="9" y="11" width="6" height="5" rx="1.5"></rect>
							<path d="M10 11V9a2 2 0 0 1 4 0v2"></path>
							<circle cx="12" cy="13.5" r="0.75" fill="currentColor"></circle>
						</svg>
					</div>
					<h1 class="animate__animated animate__fadeIn">Access Denied</h1>
					<div class="description-text animate__animated animate__fadeIn">
						<p>You do not have permission to view this page.</p>
						<p>Please check your credentials and try again.</p>
						<section class="footer"><strong>Error Code:</strong> 403</section>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
