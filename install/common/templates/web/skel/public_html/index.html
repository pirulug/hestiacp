<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Coming Soon</title>
		<style>
			body {
				background-color: #ffffff;
				margin-top: 8%;
				color: #5d5d5d;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
					"Noto Sans", sans-serif;
				text-align: center;
			}

			h1 {
				font-size: 2.45em;
				font-weight: 700;
				color: #2b2b2b;
				letter-spacing: -0.02em;
				margin-bottom: 24px;
				margin-top: 28px;
			}

			.container {
				width: 100%;
				margin-right: auto;
				margin-left: auto;
			}

			.animate__animated {
				animation-duration: 0.8s;
				animation-fill-mode: both;
			}

			.animate__fadeIn {
				animation-name: fadeIn;
			}

			.primary-color {
				color: #ff0055;
				fill: #ff0055;
			}

			.icon-large {
				height: 128px;
				width: 128px;
			}

			.description-text {
				color: #666666;
				letter-spacing: -0.01em;
				font-size: 1.25em;
				line-height: 28px;
			}

			.footer {
				margin-top: 36px;
				font-size: 0.85em;
				color: #888888;
			}

			.footer strong {
				color: #444444;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="row">
				<div class="col">
					<div class="animate__animated animate__fadeIn">
						<svg
							aria-hidden="true"
							focusable="false"
							class="primary-color icon-large"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.75"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path
								d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"
							></path>
							<path
								d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"
								fill="currentColor"
								fill-opacity="0.08"
							></path>
							<path d="M9 12H4s.55-3.03 2-4.5c1.62-1.63 5-2.5 5-2.5"></path>
							<path d="M12 15v5s3.03-.55 4.5-2c1.62-1.63 2.5-5 2.5-5"></path>
							<circle cx="15" cy="9" r="1.75" fill="currentColor"></circle>
							<path d="M6 3v3M4.5 4.5h3"></path>
							<path d="M19 16v3M17.5 17.5h3"></path>
						</svg>
					</div>
					<h1 class="animate__animated animate__fadeIn">We're working on it!</h1>
					<div class="description-text animate__animated animate__fadeIn">
						<p>This site is currently under construction.</p>
						<p>Please check back soon.</p>
						<section class="footer"><strong>Domain:</strong> %domain%</section>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
